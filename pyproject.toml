# This repo is intentionally distributed as a loadable skill checkout, not as
# an installable Python package. Keep this file for pytest/coverage tool config
# only; runtime invocation uses:
#
#   scripts/okf-loom <command> ...


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"
markers = [
    "browser: requires Playwright + an installed browser (skipped otherwise)",
]

[tool.coverage.run]
branch = true
source = ["scripts/okf_loom"]
